[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "costguard"
version = "1.0.0"
description = "Azure Infrastructure Cost Impact Predictor for Terraform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "CostGuard FinOps Team" }
]
dependencies = [
    "rich>=13.0.0",
    "requests>=2.28.0",
]

[project.scripts]
costguard = "costguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["costguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
