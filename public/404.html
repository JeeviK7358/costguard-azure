<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CostGuard</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Redirects 404 requests back to the base path
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoName = l.pathname.split('/')[1];
      if (repoName === 'costguard-azure' || repoName === 'costguard') {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/' + repoName + '/?p=' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      } else {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
      }
    </script>
  </head>
  <body>
    Redirecting to CostGuard...
  </body>
</html>
